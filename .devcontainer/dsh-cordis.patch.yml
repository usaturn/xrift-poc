# Dev Container の初回起動時に ~/.dsh/cordis.patch.yml へコピーされる雛形。
# home レベルの patch 層は各 profile の cordis.patch.yml の後に適用されるため、
# web と pi-tui の両方に効く。
#
# plugin-package-inventory-deepseek は settings.installSection を呼ばず、
# ~/.dsh/settings.yaml の層に参加しない。無効化は cordis loader の plugin config
# であるこの patch 層で行う。
- id: plugin-package-inventory-deepseek
  config:
    enabled: false

# BEGIN maatlog managed provider config — rebuilds do not update this block.
# OpenCode Go は pi-ai catalog の opencode-go route を使う。provider-level の
# baseURL を書くと catalog の endpoint を上書きして 404 になるため書かない。
- id: llm-pi-ai
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_API_KEY
        models:
          - id: deepseek-v4.1-flash

# Command Code GOAT。apiBase は API root を書き、provider が /provider/v1/... を
# 付加する。https://api.commandcode.ai/provider/v1 を書くと二重付加になる。
- id: llm-commandcode
  config:
    apiKeyEnv: COMMANDCODE_API_KEY
    apiBase: https://api.commandcode.ai
    webSearch: false

- id: agent-default-model
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
    reasoningEffort: max
# END maatlog managed provider config
