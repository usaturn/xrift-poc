name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devenv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
      # 定期掃除のテストは .devcontainer/zshrc.txt の関数を zsh で実行する。
      # .devcontainer/test-*.bash は bubblewrap と ripgrep を使う。runner の image にはどれも無い。
      # bubblewrap は apt から入れず、次の手順で build する。meson・ninja・libcap はその build に使う。
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh ripgrep meson ninja-build libcap-dev pkg-config
          zsh --version
      # agent-runner は担当の隔離に bubblewrap 0.11.0 からの --overlay-src・--tmp-overlay を使う。
      # ubuntu-latest の apt の版（0.9.0）には無いので、公式の release archive を固定版とハッシュで確かめて build する。
      - env:
          BUBBLEWRAP_VERSION: "0.11.2"
          BUBBLEWRAP_SHA256: "69abc30005d2186baf7737feacd8da35633b93cf5af38838ecff17c5f8e924f6"
        run: |
          archive="$RUNNER_TEMP/bubblewrap.tar.xz"
          curl -fsSL -o "$archive" "https://github.com/containers/bubblewrap/releases/download/v${BUBBLEWRAP_VERSION}/bubblewrap-${BUBBLEWRAP_VERSION}.tar.xz"
          printf '%s  %s\n' "$BUBBLEWRAP_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bubblewrap-src"
          tar -xJf "$archive" -C "$RUNNER_TEMP/bubblewrap-src" --strip-components=1
          meson setup "$RUNNER_TEMP/bubblewrap-build" "$RUNNER_TEMP/bubblewrap-src" --prefix "$RUNNER_TEMP/bubblewrap" \
            -Dman=disabled -Dtests=false -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/bubblewrap-build"
          meson install -C "$RUNNER_TEMP/bubblewrap-build"
          test "$("$RUNNER_TEMP/bubblewrap/bin/bwrap" --version)" = "bubblewrap ${BUBBLEWRAP_VERSION}"
          # agent-runner は担当の PATH を /bin:/usr/bin に限定する。
          sudo install -m 0755 "$RUNNER_TEMP/bubblewrap/bin/bwrap" /usr/bin/bwrap
      # pi の起動スクリプトのテストは実物の pi を使う。pi は node 上で動く（1.1.0 は node >=22.19.0）。Dev Container と同じ Node.js 24 を使う。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # CI は確かめた版に固定する。Dev Container の pi を更新したら合わせる。
      # install_beforehand.bash と同じく --ignore-scripts で入れる。
      - run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.1.0
          pi --version
      # bubblewrap は非特権 user namespace を使う。ubuntu-latest は AppArmor で制限しているため解除する。
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # 固定版が、runner の隔離と同じ形の overlay と -try の bind を受け付けることを、正式な検証の前に確かめる。
      - run: |
          test "$(env PATH=/bin:/usr/bin bwrap --version)" = "bubblewrap 0.11.2"
          lower="$(mktemp -d)"
          echo original > "$lower/file"
          env PATH=/bin:/usr/bin bwrap --unshare-pid --die-with-parent --bind / / --dev-bind /dev /dev --proc /proc \
            --overlay-src "$lower" --tmp-overlay "$lower" --ro-bind-try "$lower/missing" "$lower/missing" \
            -- sh -c 'echo changed > "$1/file" && test "$(cat "$1/file")" = changed' sh "$lower"
          test "$(cat "$lower/file")" = original
      # repository-ownership の scan_before_push のテストは実物の Gitleaks を使う。
      # Dev Container と同じ固定版を、install_beforehand.bash の定数から読んで入れる。
      - run: |
          script=.devcontainer/install_beforehand.bash
          version="$(sed -n 's/^readonly GITLEAKS_VERSION="\([^"]*\)"$/\1/p' "$script")"
          sha256="$(sed -n 's/^readonly GITLEAKS_ARCHIVE_SHA256="\([0-9a-f]*\)"$/\1/p' "$script")"
          test -n "$version" && test -n "$sha256"
          echo "Gitleaks ${version} (sha256 ${sha256})"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          printf '%s  %s\n' "$sha256" "$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - run: ./scripts/ci/verify-devenv.sh
